# Keep heap modest: host has ~16G RAM and Android Studio/emulators compete for it.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.overridePathCheck=true
# The Windows source alias and Pub cache may be on different drive roots.
kotlin.incremental=false
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
